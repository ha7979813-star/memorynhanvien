    /* =====================================================================
       1. DESIGN TOKENS & 3 BẢNG MÀU MONOCHROME CAO CẤP (ADMIN TÙY CHỈNH)
    ====================================================================== */
    :root,
    [data-theme="pure-white"] {
      --bg-page: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-surface: #F4F4F5;
      --bg-surface-hover: #E4E4E7;
      --text-primary: #09090B;
      --text-secondary: #52525B;
      --text-muted: #71717A;
      --border-subtle: #E4E4E7;
      --border-strong: #18181B;
      --accent-bg: #09090B;
      --accent-fg: #FFFFFF;
      --accent-hover: #27272A;
      --shadow-card: 0 1px 2px rgba(9, 9, 11, 0.04), 0 4px 12px rgba(9, 9, 11, 0.03);
      --shadow-elevated: 0 12px 32px rgba(9, 9, 11, 0.08);
    }

    [data-theme="warm-alabaster"] {
      --bg-page: #FAF9F6;
      --bg-card: #FDFCFA;
      --bg-surface: #F2EFE9;
      --bg-surface-hover: #E6E0D4;
      --text-primary: #1C1917;
      --text-secondary: #57534E;
      --text-muted: #78716C;
      --border-subtle: #E5DFD3;
      --border-strong: #292524;
      --accent-bg: #1C1917;
      --accent-fg: #FAF9F6;
      --accent-hover: #44403C;
      --shadow-card: 0 1px 3px rgba(28, 25, 23, 0.04), 0 4px 14px rgba(28, 25, 23, 0.03);
      --shadow-elevated: 0 12px 32px rgba(28, 25, 23, 0.09);
    }

    [data-theme="obsidian-dark"] {
      --bg-page: #09090B;
      --bg-card: #111114;
      --bg-surface: #18181C;
      --bg-surface-hover: #222228;
      --text-primary: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
      --border-subtle: #27272A;
      --border-strong: #52525B;
      --accent-bg: #FAFAFA;
      --accent-fg: #09090B;
      --accent-hover: #E4E4E7;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
      --shadow-elevated: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    /* Phong cách bo góc: Mềm mại vs Swiss Sharp */
    :root,
    [data-corners="rounded"] {
      --radius-card: 14px;
      --radius-btn: 9px;
      --radius-input: 9px;
      --radius-pill: 9999px;
    }

    [data-corners="sharp"] {
      --radius-card: 2px;
      --radius-btn: 2px;
      --radius-input: 2px;
      --radius-pill: 2px;
    }

    /* Mật độ hiển thị bảng: Thoáng rộng vs Gọn gàng */
    :root,
    [data-density="comfortable"] {
      --cell-py: 0.95rem;
      --cell-px: 1.1rem;
    }

    [data-density="compact"] {
      --cell-py: 0.6rem;
      --cell-px: 0.85rem;
    }

    /* =====================================================================
       2. CÁC LỚP TIỆN ÍCH THEME & CHUYỂN ĐỘNG MƯỢT MÀ
    ====================================================================== */
    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      transition: background-color 0.28s cubic-bezier(0.16, 1, 0.3, 1), color 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .theme-page {
      background-color: var(--bg-page);
      color: var(--text-primary);
    }

    .theme-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .theme-card-hover:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: var(--shadow-elevated);
    }

    .theme-surface {
      background-color: var(--bg-surface);
      border-color: var(--border-subtle);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .theme-border {
      border-color: var(--border-subtle);
    }

    .theme-border-strong {
      border-color: var(--border-strong);
    }

    .theme-text-secondary {
      color: var(--text-secondary);
    }

    .theme-text-muted {
      color: var(--text-muted);
    }

    .btn-primary {
      background-color: var(--accent-bg);
      color: var(--accent-fg);
      border: 1px solid var(--accent-bg);
      border-radius: var(--radius-btn);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-btn);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-secondary:hover {
      background-color: var(--bg-surface);
      border-color: var(--border-strong);
    }

    .input-field {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-input);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--border-strong);
      box-shadow: 0 0 0 3px rgba(128, 128, 128, 0.14);
    }

    .pill-badge {
      border-radius: var(--radius-pill);
    }

    .table-cell-pad {
      padding: var(--cell-py) var(--cell-px);
    }

    /* Thanh cuộn tối giản mảnh mai */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-surface);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }

    /* Hiệu ứng chuyển cảnh mượt mà */
    @keyframes tabEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-tab {
      animation: tabEnter 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalScaleIn {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .animate-modal {
      animation: modalScaleIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Bộ lọc ảnh chân dung monochrome studio */
    .portrait-mono {
      filter: grayscale(100%) contrast(1.08);
      transition: filter 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .group:hover .portrait-mono {
      filter: grayscale(40%) contrast(1.04);
      transform: scale(1.04);
    }
    .portrait-color {
      filter: none;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .group:hover .portrait-color {
      transform: scale(1.04);
    }
  </style>
</head>

      <!-- Brand Identity (Render động theo cấu hình Admin) -->
      <div id="brand-header-slot" class="flex items-center justify-between gap-3">
        <!-- Render động bằng JS -->
      </div>

      <!-- Bộ chuyển đổi vai trò & Tác vụ nhanh -->
      <div class="flex flex-wrap items-center gap-2.5 sm:gap-3">
        
        <!-- Nút nhanh Tùy chỉnh Thương hiệu & UI (Chỉ hiển thị với ADMIN) -->

          id="btn-quick-brand-ui"

          class="hidden items-center gap-1.5 px-3 py-2 text-xs font-semibold btn-secondary cursor-pointer"

        >
          <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
          <span>Tùy chỉnh Thương hiệu &amp; UI</span>
        </button>

        <!-- Công tắc chuyển đổi vai trò: [VAI TRÒ: ADMIN] <-> [VAI TRÒ: NHÂN VIÊN] -->
        <div class="flex items-center p-1 border theme-border theme-surface pill-badge w-full sm:w-auto justify-between sm:justify-start" role="group" aria-label="Chuyển đổi vai trò người dùng">
          <button
            id="btn-role-admin"
            onclick="switchRole('ADMIN')"
            class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3.5 py-1.5 text-xs font-mono font-bold pill-badge transition-all cursor-pointer"
          >
            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
            <span>VAI TRÒ: ADMIN</span>
          </button>
          
          <button
            id="btn-role-staff"
            onclick="switchRole('STAFF')"
            class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3.5 py-1.5 text-xs font-mono font-bold pill-badge transition-all cursor-pointer"
          >
            <i data-lucide="user" class="w-3.5 h-3.5"></i>
            <span>VAI TRÒ: NHÂN VIÊN</span>
          </button>
        </div>

        <!-- Bộ chọn tài khoản nhân viên đang đăng nhập (Khi ở chế độ Nhân viên) -->
        <div id="staff-identity-box" class="hidden items-center gap-2 border theme-border theme-card px-2.5 py-1.5 text-xs w-full sm:w-auto" style="border-radius: var(--radius-btn);">

            onchange="changeActiveStaff(this.value)"

    </div>

    /**
     * KHỞI TẠO VÀ LƯU TRỮ STATE
     */
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return {
            ...structuredClone(DEFAULT_DATA),
            ...parsed,
            branding: {
              ...structuredClone(DEFAULT_DATA.branding),
              ...(parsed.branding || {})
            },
            customFields: {
              ...structuredClone(DEFAULT_DATA.customFields),
              ...(parsed.customFields || {})
            }
          };
        }
      } catch (err) {
        console.error('Lỗi đọc dữ liệu localStorage:', err);
      }
      return structuredClone(DEFAULT_DATA);
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        showToast('CẢNH BÁO BỘ NHỚ', 'Dung lượng ảnh quá lớn vượt giới hạn trình duyệt. Vui lòng chọn ảnh nhẹ hơn.');
      }
    }

    /**
     * ÁP DỤNG CẤU HÌNH GIAO DIỆN DO ADMIN THIẾT LẬP LÊN THẺ <HTML>
     */
    function applyThemeAttributes() {
      const html = document.documentElement;
      const b = state.branding;
      html.setAttribute('data-theme', b.theme || 'pure-white');
      html.setAttribute('data-corners', b.corners || 'rounded');
      html.setAttribute('data-density', b.density || 'comfortable');
      document.title = `${b.brandName} — ${b.tagline}`;
    }

    /**
     * TIỆN ÍCH CHUNG
     */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function isAdmin() {
      return state.role === 'ADMIN';
    }

    function getCurrentTimestamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
    }

    function getCurrentActorName() {
      if (isAdmin()) return 'Quản trị viên (Admin)';
      const staff = state.staff.find(s => s.id === state.activeStaffId);
      return staff ? staff.name : 'Nhân viên Studio';
    }

    /**
     * NÉN ẢNH UPLOAD QUA CANVAS ĐỂ TỐI ƯU TỐC ĐỘ & LOCALSTORAGE
     */
    function compressImageFile(file, maxSize = 360) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /**
     * HỆ THỐNG THÔNG BÁO TOAST
     */
    function showToast(title, message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto border theme-border-strong p-3.5 shadow-xl flex items-start justify-between gap-3 animate-modal';
      toast.style.backgroundColor = 'var(--accent-bg)';
      toast.style.color = 'var(--accent-fg)';
      toast.style.borderRadius = 'var(--radius-btn)';

      const timeStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      toast.innerHTML = `
        <div class="space-y-0.5">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full" style="background-color: var(--accent-fg);"></span>
            <span class="font-mono text-[11px] font-bold tracking-wider uppercase">${escapeHtml(title)}</span>
            <span class="font-mono text-[10px] opacity-60">${timeStr}</span>
          </div>
          <p class="text-xs opacity-90 leading-relaxed pl-4">${escapeHtml(message)}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100 text-xs font-mono px-1 cursor-pointer" aria-label="Đóng">✕</button>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentElement) {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(6px)';
          toast.style.transition = 'all 0.22s ease';
          setTimeout(() => toast.remove(), 220);
        }
      }, 3600);
    }

    /**
     * HỆ THỐNG MODAL TÙY BIẾN
     */
    function openModal(htmlContent, maxWidthClass = 'max-w-2xl') {
      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      panel.className = `theme-card border theme-border-strong w-full ${maxWidthClass} shadow-2xl overflow-hidden my-auto animate-modal`;
      panel.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'modal-backdrop') closeModal();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /**

     */
    function switchRole(newRole) {
      if (state.role === newRole) return;
      state.role = newRole;

      if (newRole === 'STAFF' && state.activeTab === 'structure') {
        state.activeTab = 'files';
      }
      if (newRole === 'ADMIN') {
        filters.myScheduleOnly = false;
      }

      saveState();
      renderApp();

      if (newRole === 'ADMIN') {
        showToast('VAI TRÒ: ADMIN', 'Đã mở khóa toàn quyền cấu trúc dữ liệu, tùy chỉnh thương hiệu & giao diện.');

      }
    }

     */
    function renderStaffTab() {

      const statuses = ['ALL', 'Sẵn sàng', 'Đang đi job', 'Nghỉ phép'];

      const filteredStaff = state.staff.filter(s => {
        const matchSearch =
          s.name.toLowerCase().includes(filters.staffSearch.toLowerCase()) ||
          s.id.toLowerCase().includes(filters.staffSearch.toLowerCase()) ||
          s.position.toLowerCase().includes(filters.staffSearch.toLowerCase()) ||
          (s.gear || '').toLowerCase().includes(filters.staffSearch.toLowerCase());
        const matchSpec = filters.staffSpecialty === 'ALL' || s.specialty === filters.staffSpecialty;
        const matchStatus = filters.staffStatus === 'ALL' || s.status === filters.staffStatus;
        return matchSearch && matchSpec && matchStatus;

                  class="inline-flex items-center gap-1.5 px-3 py-2 font-semibold cursor-pointer transition-colors"
                  style="${state.staffViewMode === 'grid' ? 'background-color: var(--accent-bg); color: var(--accent-fg);' : 'background-color: var(--bg-card); color: var(--text-primary);'}"
                >
                  <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                  <span>Lưới Thẻ</span>
                </button>
                <button 
                  onclick="state.staffViewMode = 'table'; saveState(); renderWorkspaceOnly();"
                  class="inline-flex items-center gap-1.5 px-3 py-2 font-semibold border-l theme-border cursor-pointer transition-colors"
                  style="${state.staffViewMode === 'table' ? 'background-color: var(--accent-bg); color: var(--accent-fg);' : 'background-color: var(--bg-card); color: var(--text-primary);'}"
                >
                  <i data-lucide="table-2" class="w-3.5 h-3.5"></i>
                  <span>Dạng Bảng</span>
                </button>
              </div>

              ${isAdmin() ? `
                <button 
                  onclick="openQuickCustomFieldModal('staff')"
                  class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-mono font-semibold btn-secondary cursor-pointer"

                  <i data-lucide="columns-3" class="w-3.5 h-3.5"></i>
                  <span>+ Thêm cột</span>
                </button>
                <button 
                  onclick="openStaffModal()"
                  class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold btn-primary cursor-pointer"
                >
                  <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
                  <span>+ Thêm Nhân Sự</span>
                </button>
              ` : `
                <div class="inline-flex items-center gap-2 px-3 py-2 border border-dashed theme-border-strong theme-surface text-xs font-mono" style="border-radius: var(--radius-btn);">

                  <span>CHỈ XEM HỒ SƠ NHÂN SỰ</span>
                </div>
              `}
            </div>
          </div>

          <!-- Bộ lọc tìm kiếm nhân sự -->

            <div>
              <label class="block font-mono text-[11px] uppercase theme-text-muted mb-1.5">Tìm nhân sự / thiết bị</label>

            const fallbackUrl = getFallbackAvatarUrl(person.name);
            const assignedCount = state.schedules.filter(s => s.staffId === person.id).length;

                          class="inline-flex items-center gap-1.5 px-2.5 py-0.5 text-[11px] font-mono font-semibold pill-badge border"
                          style="${
                            isReady
                              ? 'background-color: var(--accent-bg); color: var(--accent-fg); border-color: var(--accent-bg);'
                              : isOnJob
                              ? 'background-color: var(--bg-card); color: var(--text-primary); border-color: var(--border-strong);'

                          }"
                        >
                          <span class="w-1.5 h-1.5 rounded-full" style="background-color: currentColor;"></span>
                          ${escapeHtml(person.status)}

                          ${escapeHtml(person.specialty)}

                        <span class="text-[11px] font-mono px-2 py-0.5 theme-surface border theme-border theme-text-secondary" style="border-radius: 4px;">
                          ${assignedCount} ca lịch

                    </div>
                  </div>

                  <!-- Phần giữa thẻ: Thiết bị & Trường dữ liệu động -->

                    </div>
                    <div class="flex items-center gap-2 font-mono text-[11px]">

                        <div class="flex items-center gap-3">

                            src="${escapeHtml(avatarUrl)}" 
                            onerror="this.onerror=null; this.src='${escapeHtml(fallbackUrl)}';"

                            class="w-11 h-11 rounded-full object-cover border theme-border-strong shrink-0 cursor-pointer ${portraitClass}"

                            <div class="flex items-center gap-1.5">

                              <button onclick="openStaffDetailModal('${escapeHtml(person.id)}')" class="font-bold text-sm hover:underline cursor-pointer text-left">
                                ${escapeHtml(person.name)}
                              </button>
                            </div>
                            <div class="theme-text-secondary mt-0.5">${escapeHtml(person.position)}</div>
                          </div>
                        </div>
                      </td>
                      <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                        <span class="px-2.5 py-1 border theme-border theme-surface font-mono text-[11px]" style="border-radius: 4px;">
                          ${escapeHtml(person.specialty)}
                        </span>
                      </td>
                      <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                        <span 
                          class="inline-flex items-center gap-1.5 px-2.5 py-1 border pill-badge text-[11px] font-mono font-semibold"
                          style="${
                            isReady
                              ? 'background-color: var(--accent-bg); color: var(--accent-fg); border-color: var(--accent-bg);'
                              : isOnJob
                              ? 'background-color: var(--bg-card); color: var(--text-primary); border-color: var(--border-strong);'
                              : 'background-color: var(--bg-surface); color: var(--text-muted); border-color: var(--border-subtle); border-style: dashed;'
                          }"
                        >
                          <span class="w-1.5 h-1.5 rounded-full" style="background-color: currentColor;"></span>
                          ${escapeHtml(person.status)}
                        </span>
                      </td>
                      <td class="table-cell-pad border-r theme-border theme-text-secondary max-w-xs">
                        ${escapeHtml(person.gear || '—')}
                      </td>
                      <td class="table-cell-pad border-r theme-border font-mono text-[11px] whitespace-nowrap">
                        <div class="font-semibold">${escapeHtml(person.phone)}</div>
                        <div class="theme-text-muted">${escapeHtml(person.email)}</div>
                      </td>
                      ${customCols.map(cf => `
                        <td class="table-cell-pad border-r theme-border theme-text-secondary">
                          ${escapeHtml(person.customValues?.[cf.id] || '—')}
                        </td>
                      `).join('')}
                      <td class="table-cell-pad text-right whitespace-nowrap">
                        <div class="inline-flex items-center gap-1.5">
                          <button 
                            onclick="openStaffDetailModal('${escapeHtml(person.id)}')"
                            class="px-2.5 py-1.5 font-mono text-[11px] font-semibold btn-secondary cursor-pointer"
                          >
                            Hồ sơ
                          </button>
                          ${isAdmin() ? `
                            <button 
                              onclick="openStaffModal('${escapeHtml(person.id)}')"
                              class="px-2.5 py-1.5 font-mono text-[11px] font-semibold btn-secondary cursor-pointer"
                            >
                              Sửa
                            </button>
                            <button 
                              onclick="confirmDeleteStaff('${escapeHtml(person.id)}')"
                              class="px-2.5 py-1.5 font-mono text-[11px] font-semibold btn-secondary cursor-pointer"
                            >
                              Xóa
                            </button>
                          ` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    /**
     * =====================================================================
     * TAB 02: PHÂN CÔNG LỊCH LÀM VIỆC (KÈM AVATAR NHÂN SỰ + LỌC "LỊCH CỦA TÔI")
     * =====================================================================
     */
    function renderScheduleTab() {
      const statuses = ['ALL', 'Sắp diễn ra', 'Đang thực hiện', 'Hoàn thành'];
      const effectiveStaffFilter = filters.myScheduleOnly ? state.activeStaffId : filters.scheduleStaffId;

      const filteredSchedules = state.schedules.filter(item => {
        const staffObj = state.staff.find(s => s.id === item.staffId);
        const staffName = staffObj ? staffObj.name : '';
        const matchSearch =
          item.project.toLowerCase().includes(filters.scheduleSearch.toLowerCase()) ||
          item.task.toLowerCase().includes(filters.scheduleSearch.toLowerCase()) ||
          item.location.toLowerCase().includes(filters.scheduleSearch.toLowerCase()) ||
          staffName.toLowerCase().includes(filters.scheduleSearch.toLowerCase());
        const matchStaff = effectiveStaffFilter === 'ALL' || item.staffId === effectiveStaffFilter;
        const matchStatus = filters.scheduleStatus === 'ALL' || item.status === filters.scheduleStatus;
        return matchSearch && matchStaff && matchStatus;
      });

      const customCols = state.customFields.schedule;
      const portraitClass = state.branding.monoAvatars ? 'portrait-mono' : 'portrait-color';

      return `
        <div class="space-y-5">
          <!-- Header Tab Lịch làm việc -->
          <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3.5 pb-4 border-b theme-border">
            <div>
              <h2 class="text-lg sm:text-xl font-extrabold tracking-tight">Phân Công Lịch Sản Xuất &amp; Ca Làm Việc</h2>
              <p class="text-xs theme-text-secondary mt-0.5">
                Điều phối lịch quay, dựng hậu kỳ, nhiếp ảnh và thu âm theo từng dự án và nhân sự phụ trách.
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <!-- Chuyển đổi chế độ xem: Dạng Bảng Chi Tiết vs Dạng Thẻ Theo Ngày -->
              <div class="inline-flex border theme-border overflow-hidden text-xs font-mono" style="border-radius: var(--radius-btn);">
                <button 
                  onclick="state.scheduleViewMode = 'table'; saveState(); renderWorkspaceOnly();"
                  class="inline-flex items-center gap-1.5 px-3 py-2 font-semibold cursor-pointer"
                  style="${state.scheduleViewMode === 'table' ? 'background-color: var(--accent-bg); color: var(--accent-fg);' : 'background-color: var(--bg-card); color: var(--text-primary);'}"
                >
                  <i data-lucide="table" class="w-3.5 h-3.5"></i>
                  <span>Bảng Chi Tiết</span>
                </button>
                <button 
                  onclick="state.scheduleViewMode = 'timeline'; saveState(); renderWorkspaceOnly();"
                  class="inline-flex items-center gap-1.5 px-3 py-2 font-semibold border-l theme-border cursor-pointer"
                  style="${state.scheduleViewMode === 'timeline' ? 'background-color: var(--accent-bg); color: var(--accent-fg);' : 'background-color: var(--bg-card); color: var(--text-primary);'}"
                >
                  <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i>
                  <span>Theo Ngày / Timeline</span>
                </button>
              </div>

              ${isAdmin() ? `
                <button 
                  onclick="openQuickCustomFieldModal('schedule')"
                  class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-mono font-semibold btn-secondary cursor-pointer"
                >
                  <i data-lucide="columns-3" class="w-3.5 h-3.5"></i>
                  <span>+ Thêm cột</span>
                </button>
                <button 
                  onclick="openScheduleModal()"
                  class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold btn-primary cursor-pointer"
                >
                  <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
                  <span>+ Tạo Lịch Phân Công</span>
                </button>
              ` : `
                <div class="inline-flex items-center gap-2 px-3 py-2 border border-dashed theme-border-strong theme-surface text-xs font-mono" style="border-radius: var(--radius-btn);">
                  <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                  <span>CHỈ XEM LỊCH PHÂN CÔNG</span>
                </div>
              `}
            </div>
          </div>

          <!-- Bộ lọc thông minh (Có nút Lọc nhanh "Lịch của tôi") -->
          <div class="theme-surface p-3.5 border theme-border space-y-3" style="border-radius: var(--radius-card);">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <button
                  onclick="filters.myScheduleOnly = !filters.myScheduleOnly; if(filters.myScheduleOnly) filters.scheduleStaffId = 'ALL'; renderWorkspaceOnly();"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-mono font-bold border cursor-pointer transition-all"
                  style="${
                    filters.myScheduleOnly
                      ? 'background-color: var(--accent-bg); color: var(--accent-fg); border-color: var(--accent-bg); border-radius: var(--radius-pill);'
                      : 'background-color: var(--bg-card); color: var(--text-primary); border-color: var(--border-strong); border-radius: var(--radius-pill);'
                  }"
                >
                  <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
                  <span>Lịch của tôi (${escapeHtml((state.staff.find(s => s.id === state.activeStaffId) || {}).name || 'Nhân sự')})</span>
                </button>

                ${filters.myScheduleOnly || filters.scheduleStaffId !== 'ALL' || filters.scheduleStatus !== 'ALL' || filters.scheduleSearch ? `
                  <button
                    onclick="filters.myScheduleOnly = false; filters.scheduleStaffId = 'ALL'; filters.scheduleStatus = 'ALL'; filters.scheduleSearch = ''; renderWorkspaceOnly();"
                    class="text-xs font-mono underline theme-text-secondary hover:opacity-80 cursor-pointer px-2"
                  >
                    Xóa bộ lọc
                  </button>
                ` : ''}
              </div>

              <span class="font-mono text-[11px] theme-text-muted">
                Hiển thị <strong>${filteredSchedules.length}</strong> / ${state.schedules.length} ca làm việc
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block font-mono text-[11px] uppercase theme-text-muted mb-1">Tìm dự án / đầu việc / địa điểm</label>
                <input 
                  type="text" 
                  value="${escapeHtml(filters.scheduleSearch)}"
                  oninput="filters.scheduleSearch = this.value; renderWorkspaceOnly();"
                  placeholder="TVC Tết, Ocean Park, Rough Cut..."
                  class="w-full px-3 py-2 text-xs input-field"
                />
              </div>
              <div>
                <label class="block font-mono text-[11px] uppercase theme-text-muted mb-1">Nhân sự phụ trách</label>
                <select 
                  onchange="filters.myScheduleOnly = false; filters.scheduleStaffId = this.value; renderWorkspaceOnly();"
                  class="w-full px-3 py-2 text-xs input-field cursor-pointer"
                >
                  <option value="ALL" ${effectiveStaffFilter === 'ALL' ? 'selected' : ''}>Tất cả nhân sự</option>
                  ${state.staff.map(s => `
                    <option value="${escapeHtml(s.id)}" ${effectiveStaffFilter === s.id ? 'selected' : ''}>
                      ${escapeHtml(s.name)} — ${escapeHtml(s.specialty)}
                    </option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="block font-mono text-[11px] uppercase theme-text-muted mb-1">Trạng thái ca việc</label>
                <select 
                  onchange="filters.scheduleStatus = this.value; renderWorkspaceOnly();"
                  class="w-full px-3 py-2 text-xs input-field cursor-pointer"
                >
                  ${statuses.map(st => `<option value="${escapeHtml(st)}" ${filters.scheduleStatus === st ? 'selected' : ''}>${st === 'ALL' ? 'Tất cả trạng thái' : escapeHtml(st)}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>

          ${state.scheduleViewMode === 'table'
            ? renderScheduleTable(filteredSchedules, customCols, portraitClass)
            : renderScheduleTimeline(filteredSchedules, customCols, portraitClass)}
        </div>
      `;
    }

    function renderScheduleTable(items, customCols, portraitClass) {
      return `
        <div class="theme-card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="theme-surface border-b theme-border-strong font-mono text-[11px] uppercase theme-text-secondary">
                  <th class="table-cell-pad border-r theme-border">Ngày &amp; Ca làm việc</th>
                  <th class="table-cell-pad border-r theme-border">Dự án &amp; Nội dung công việc</th>
                  <th class="table-cell-pad border-r theme-border">Nhân sự phụ trách</th>
                  <th class="table-cell-pad border-r theme-border">Địa điểm</th>
                  <th class="table-cell-pad border-r theme-border">Trạng thái</th>
                  ${customCols.map(cf => `
                    <th class="table-cell-pad border-r theme-border">
                      <div class="flex items-center gap-1">
                        <span>${escapeHtml(cf.label)}</span>
                        <span class="text-[9px] px-1 border theme-border" style="border-radius: 3px;">CUSTOM</span>
                      </div>
                    </th>
                  `).join('')}
                  ${isAdmin() ? `<th class="table-cell-pad text-right">Thao tác Admin</th>` : ''}
                </tr>
              </thead>
              <tbody class="divide-y theme-border text-xs">
                ${items.length === 0 ? `
                  <tr>
                    <td colspan="${6 + customCols.length}" class="py-10 text-center theme-text-muted font-mono">
                      Không có lịch làm việc nào khớp với bộ lọc hiện tại.
                    </td>
                  </tr>
                ` : items.map(sch => {
                  const staffObj = state.staff.find(s => s.id === sch.staffId);
                  const avatarUrl = staffObj ? (staffObj.avatar || getFallbackAvatarUrl(staffObj.name)) : '';
                  const fallbackUrl = staffObj ? getFallbackAvatarUrl(staffObj.name) : '';

                  return `
                    <tr class="group transition-colors" style="background-color: var(--bg-card);">
                      <td class="table-cell-pad border-r theme-border whitespace-nowrap font-mono">
                        <div class="font-bold">${escapeHtml(sch.date)}</div>
                        <div class="text-[11px] theme-text-secondary mt-0.5">${escapeHtml(sch.shift)}</div>
                      </td>
                      <td class="table-cell-pad border-r theme-border max-w-xs">
                        <div class="font-mono text-[11px] font-semibold theme-text-muted">${escapeHtml(sch.project)}</div>
                        <div class="font-bold mt-0.5 leading-snug">${escapeHtml(sch.task)}</div>
                      </td>
                      <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                        ${staffObj ? `
                          <div class="flex items-center gap-2.5">
                            <img 
                              src="${escapeHtml(avatarUrl)}" 
                              onerror="this.onerror=null; this.src='${escapeHtml(fallbackUrl)}';"
                              alt="${escapeHtml(staffObj.name)}"
                              class="w-8 h-8 rounded-full object-cover border theme-border-strong shrink-0 ${portraitClass}"
                            />
                            <div>
                              <div class="font-bold">${escapeHtml(staffObj.name)}</div>
                              <div class="text-[11px] theme-text-muted font-mono">${escapeHtml(staffObj.specialty)}</div>
                            </div>
                          </div>
                        ` : `<span class="theme-text-muted italic">Chưa chỉ định</span>`}
                      </td>
                      <td class="table-cell-pad border-r theme-border theme-text-secondary">
                        ${escapeHtml(sch.location)}
                      </td>
                      <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                        ${isAdmin() ? `
                          <select 
                            onchange="quickUpdateScheduleStatus('${escapeHtml(sch.id)}', this.value)"
                            class="px-2.5 py-1 font-mono text-[11px] font-semibold border theme-border-strong cursor-pointer"
                            style="border-radius: var(--radius-btn); ${
                              sch.status === 'Đang thực hiện'
                                ? 'background-color: var(--accent-bg); color: var(--accent-fg);'
                                : 'background-color: var(--bg-card); color: var(--text-primary);'
                            }"
                          >
                            ${['Sắp diễn ra', 'Đang thực hiện', 'Hoàn thành'].map(st => `
                              <option value="${st}" ${sch.status === st ? 'selected' : ''} style="background-color: var(--bg-card); color: var(--text-primary);">${st}</option>
                            `).join('')}
                          </select>
                        ` : `
                          <span 
                            class="inline-block px-2.5 py-1 border font-mono text-[11px] font-semibold pill-badge"
                            style="${
                              sch.status === 'Đang thực hiện'
                                ? 'background-color: var(--accent-bg); color: var(--accent-fg); border-color: var(--accent-bg);'
                                : sch.status === 'Hoàn thành'
                                ? 'background-color: var(--bg-surface); color: var(--text-secondary); border-color: var(--border-subtle);'
                                : 'background-color: var(--bg-card); color: var(--text-primary); border-color: var(--border-strong);'
                            }"
                          >
                            ${escapeHtml(sch.status)}
                          </span>
                        `}
                      </td>
                      ${customCols.map(cf => `
                        <td class="table-cell-pad border-r theme-border theme-text-secondary">
                          ${escapeHtml(sch.customValues?.[cf.id] || '—')}
                        </td>
                      `).join('')}
                      ${isAdmin() ? `
                        <td class="table-cell-pad text-right whitespace-nowrap">
                          <div class="inline-flex items-center gap-1.5">
                            <button 
                              onclick="openScheduleModal('${escapeHtml(sch.id)}')"
                              class="px-2.5 py-1.5 font-mono text-[11px] font-semibold btn-secondary cursor-pointer"
                            >
                              Sửa
                            </button>
                            <button 
                              onclick="confirmDeleteSchedule('${escapeHtml(sch.id)}')"
                              class="px-2.5 py-1.5 font-mono text-[11px] font-semibold btn-secondary cursor-pointer"
                            >
                              Xóa
                            </button>
                          </div>
                        </td>
                      ` : ''}
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderScheduleTimeline(items, customCols, portraitClass) {
      if (items.length === 0) {
        return `
          <div class="theme-card p-12 text-center theme-text-muted font-mono text-xs">
            Không có lịch làm việc nào khớp với bộ lọc.
          </div>
        `;
      }

      const grouped = {};
      items.forEach(item => {
        if (!grouped[item.date]) grouped[item.date] = [];
        grouped[item.date].push(item);
      });

      const sortedDates = Object.keys(grouped).sort();

      return `
        <div class="space-y-5">
          ${sortedDates.map(dateStr => `
            <div class="theme-card overflow-hidden">
              <div class="px-4 sm:px-5 py-3 flex items-center justify-between" style="background-color: var(--accent-bg); color: var(--accent-fg);">
                <div class="flex items-center gap-2 font-mono text-xs font-bold tracking-wider">
                  <i data-lucide="calendar" class="w-4 h-4"></i>
                  <span>NGÀY SẢN XUẤT: ${escapeHtml(dateStr)}</span>
                </div>
                <span class="font-mono text-[11px] px-2.5 py-0.5 font-bold" style="background-color: var(--accent-fg); color: var(--accent-bg); border-radius: var(--radius-pill);">
                  ${grouped[dateStr].length} CA PHÂN CÔNG
                </span>
              </div>

              <div class="divide-y theme-border">
                ${grouped[dateStr].map(sch => {
                  const staffObj = state.staff.find(s => s.id === sch.staffId);
                  const avatarUrl = staffObj ? (staffObj.avatar || getFallbackAvatarUrl(staffObj.name)) : '';
                  const fallbackUrl = staffObj ? getFallbackAvatarUrl(staffObj.name) : '';

                  return `
                    <div class="group p-4 sm:p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4 transition-colors">
                      <div class="flex items-start gap-3.5 flex-1">
                        ${staffObj ? `
                          <img 
                            src="${escapeHtml(avatarUrl)}" 
                            onerror="this.onerror=null; this.src='${escapeHtml(fallbackUrl)}';"
                            alt="${escapeHtml(staffObj.name)}"
                            class="w-11 h-11 rounded-full object-cover border theme-border-strong shrink-0 mt-0.5 ${portraitClass}"
                          />
                        ` : ''}
                        <div class="space-y-1.5 flex-1">
                          <div class="flex flex-wrap items-center gap-2">
                            <span class="font-mono text-xs font-bold px-2.5 py-0.5 border theme-border-strong theme-surface" style="border-radius: 4px;">
                              ${escapeHtml(sch.shift)}
                            </span>
                            <span class="font-mono text-xs theme-text-secondary font-semibold">
                              ${escapeHtml(sch.project)}
                            </span>
                            <span 
                              class="font-mono text-[11px] px-2.5 py-0.5 border pill-badge font-semibold"
                              style="${sch.status === 'Đang thực hiện' ? 'background-color: var(--accent-bg); color: var(--accent-fg); border-color: var(--accent-bg);' : 'border-color: var(--border-strong);'}"
                            >
                              ${escapeHtml(sch.status)}
                            </span>
                          </div>
                          <h4 class="font-bold text-sm sm:text-base">${escapeHtml(sch.task)}</h4>
                          <div class="flex flex-wrap items-center gap-x-5 gap-y-1 text-xs theme-text-secondary">
                            <span><strong style="color: var(--text-primary);">Phụ trách:</strong> ${staffObj ? `${escapeHtml(staffObj.name)} (${escapeHtml(staffObj.specialty)})` : 'Chưa chỉ định'}</span>
                            <span><strong style="color: var(--text-primary);">Địa điểm:</strong> ${escapeHtml(sch.location)}</span>
                            ${customCols.map(cf => `
                              <span><strong style="color: var(--text-primary);">${escapeHtml(cf.label)}:</strong> ${escapeHtml(sch.customValues?.[cf.id] || '—')}</span>
                            `).join('')}
                          </div>
                        </div>
                      </div>

                      ${isAdmin() ? `
                        <div class="flex items-center gap-2 shrink-0">
                          <button onclick="openScheduleModal('${escapeHtml(sch.id)}')" class="px-3 py-1.5 font-mono text-xs font-semibold btn-secondary cursor-pointer">
                            Sửa lịch
                          </button>
                          <button onclick="confirmDeleteSchedule('${escapeHtml(sch.id)}')" class="px-3 py-1.5 font-mono text-xs font-semibold btn-secondary cursor-pointer">
                            Xóa
                          </button>
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function quickUpdateScheduleStatus(scheduleId, newStatus) {
      if (!isAdmin()) return;
      const idx = state.schedules.findIndex(s => s.id === scheduleId);
      if (idx !== -1) {
        state.schedules[idx].status = newStatus;
        saveState();
        renderApp();
        showToast('ĐỔI TRẠNG THÁI LỊCH', `Ca ${scheduleId} đã chuyển sang: ${newStatus}.`);
      }
    }

    /**
     * =====================================================================
     * TAB 03: FILE DỮ LIỆU SẢN XUẤT (THÊM & SỬA FILE MỞ KHÓA + LOCK/DELETE ADMIN)
     * =====================================================================
     */
    function renderFilesTab() {
      const categories = ['ALL', ...state.fileCategories];
      const projects = ['ALL', ...state.projects];

      const filteredFiles = state.files.filter(f => {
        const matchSearch =
          f.name.toLowerCase().includes(filters.fileSearch.toLowerCase()) ||
          f.id.toLowerCase().includes(filters.fileSearch.toLowerCase()) ||
          f.updatedBy.toLowerCase().includes(filters.fileSearch.toLowerCase()) ||
          f.notes.toLowerCase().includes(filters.fileSearch.toLowerCase());
        const matchCat = filters.fileCategory === 'ALL' || f.category === filters.fileCategory;
        const matchPrj = filters.fileProject === 'ALL' || f.project === filters.fileProject;
        return matchSearch && matchCat && matchPrj;
      });

      const customCols = state.customFields.files;
      const portraitClass = state.branding.monoAvatars ? 'portrait-mono' : 'portrait-color';

      return `
        <div class="space-y-5">
          <!-- Header Tab File Dữ Liệu -->
          <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3.5 pb-4 border-b theme-border">
            <div>
              <h2 class="text-lg sm:text-xl font-extrabold tracking-tight">Kho File Dữ Liệu Sản Xuất &amp; Phiên Bản</h2>
              <p class="text-xs theme-text-secondary mt-0.5">
                Quản lý Source RAW, Project dựng, Bản Master và nhật ký lịch sử cập nhật phiên bản.
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              ${isAdmin() ? `
                <button 
                  onclick="openQuickCustomFieldModal('files')"
                  class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-mono font-semibold btn-secondary cursor-pointer"
                >
                  <i data-lucide="columns-3" class="w-3.5 h-3.5"></i>
                  <span>+ Thêm cột file</span>
                </button>
              ` : `
                <span class="px-3 py-2 border theme-border-strong theme-surface font-mono text-[11px] font-semibold" style="border-radius: var(--radius-btn);">
                  QUYỀN NHÂN VIÊN: THÊM &amp; SỬA FILE MỞ KHÓA
                </span>
              `}
              
              <!-- Cả Admin & Nhân viên đều có quyền Thêm File Mới -->
              <button 
                onclick="openFileModal()"
                class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold btn-primary cursor-pointer"
              >
                <i data-lucide="file-plus-2" class="w-3.5 h-3.5"></i>
                <span>+ Thêm File Mới</span>
              </button>
            </div>
          </div>

          <!-- Bộ lọc tìm kiếm file -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 theme-surface p-3.5 border theme-border" style="border-radius: var(--radius-card);">
            <div>
              <label class="block font-mono text-[11px] uppercase theme-text-muted mb-1.5">Tìm tên file / mã / người cập nhật</label>
              <input 
                type="text" 
                value="${escapeHtml(filters.fileSearch)}"
                oninput="filters.fileSearch = this.value; renderWorkspaceOnly();"
                placeholder="RAW, Timeline, FILE-001, Minh Quân..."
                class="w-full px-3 py-2 text-xs input-field"
              />
            </div>
            <div>
              <label class="block font-mono text-[11px] uppercase theme-text-muted mb-1.5">Phân loại File</label>
              <select 
                onchange="filters.fileCategory = this.value; renderWorkspaceOnly();"
                class="w-full px-3 py-2 text-xs input-field cursor-pointer"
              >
                ${categories.map(cat => `<option value="${escapeHtml(cat)}" ${filters.fileCategory === cat ? 'selected' : ''}>${cat === 'ALL' ? 'Tất cả phân loại file' : escapeHtml(cat)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block font-mono text-[11px] uppercase theme-text-muted mb-1.5">Dự án liên quan</label>
              <select 
                onchange="filters.fileProject = this.value; renderWorkspaceOnly();"
                class="w-full px-3 py-2 text-xs input-field cursor-pointer"
              >
                ${projects.map(prj => `<option value="${escapeHtml(prj)}" ${filters.fileProject === prj ? 'selected' : ''}>${prj === 'ALL' ? 'Tất cả dự án' : escapeHtml(prj)}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- Bảng File Sản xuất -->
          <div class="theme-card overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="theme-surface border-b theme-border-strong font-mono text-[11px] uppercase theme-text-secondary">
                    <th class="table-cell-pad border-r theme-border">Mã &amp; Tên File</th>
                    <th class="table-cell-pad border-r theme-border">Phân loại</th>
                    <th class="table-cell-pad border-r theme-border">Phiên bản</th>
                    <th class="table-cell-pad border-r theme-border">Đường dẫn lưu trữ</th>
                    <th class="table-cell-pad border-r theme-border">Cập nhật gần nhất</th>
                    <th class="table-cell-pad border-r theme-border">Ghi chú sản xuất</th>
                    ${customCols.map(cf => `
                      <th class="table-cell-pad border-r theme-border">
                        <div class="flex items-center gap-1">
                          <span>${escapeHtml(cf.label)}</span>
                          <span class="text-[9px] px-1 border theme-border" style="border-radius: 3px;">CUSTOM</span>
                        </div>
                      </th>
                    `).join('')}
                    <th class="table-cell-pad text-right">Thao tác</th>
                  </tr>
                </thead>
                <tbody class="divide-y theme-border text-xs">
                  ${filteredFiles.length === 0 ? `
                    <tr>
                      <td colspan="${8 + customCols.length}" class="py-10 text-center theme-text-muted font-mono">
                        Chưa có file dữ liệu nào khớp với bộ lọc hiện tại.
                      </td>
                    </tr>
                  ` : filteredFiles.map(file => {
                    const historyCount = file.history ? file.history.length : 1;
                    const updaterStaff = getStaffByName(file.updatedBy);
                    const updaterAvatar = updaterStaff ? (updaterStaff.avatar || getFallbackAvatarUrl(file.updatedBy)) : getFallbackAvatarUrl(file.updatedBy);
                    const updaterFallback = getFallbackAvatarUrl(file.updatedBy);
                    const canEditFile = isAdmin() || !file.locked;

                    return `
                      <tr class="group transition-colors" style="background-color: var(--bg-card);">
                        <td class="table-cell-pad border-r theme-border max-w-xs">
                          <div class="flex flex-wrap items-center gap-1.5">
                            <span class="font-mono text-[11px] font-bold px-1.5 py-0.5 theme-surface border theme-border" style="border-radius: 4px;">
                              ${escapeHtml(file.id)}
                            </span>
                            ${file.locked ? `
                              <span class="inline-flex items-center gap-1 font-mono text-[10px] font-bold px-1.5 py-0.5" style="background-color: var(--accent-bg); color: var(--accent-fg); border-radius: 4px;">
                                <i data-lucide="lock" class="w-2.5 h-2.5"></i>
                                <span>ĐÃ KHÓA</span>
                              </span>
                            ` : `
                              <span class="inline-flex items-center gap-1 font-mono text-[10px] px-1.5 py-0.5 border theme-border theme-text-muted" style="border-radius: 4px;">
                                <i data-lucide="unlock" class="w-2.5 h-2.5"></i>
                                <span>MỞ</span>
                              </span>
                            `}
                          </div>
                          <div class="font-mono font-bold mt-1.5 break-all">
                            ${escapeHtml(file.name)}
                          </div>
                          <div class="text-[11px] theme-text-muted mt-0.5 truncate">
                            ${escapeHtml(file.project)}
                          </div>
                        </td>

                        <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                          <span class="px-2.5 py-1 border theme-border-strong font-mono text-[11px] font-semibold" style="border-radius: 4px;">
                            ${escapeHtml(file.category)}
                          </span>
                        </td>

                        <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                          <button 
                            onclick="openFileHistoryModal('${escapeHtml(file.id)}')"
                            class="inline-flex items-center gap-1.5 px-2.5 py-1 font-mono text-[11px] font-bold cursor-pointer transition-transform hover:scale-105"
                            style="background-color: var(--accent-bg); color: var(--accent-fg); border-radius: var(--radius-btn);"
                            title="Xem lịch sử ${historyCount} phiên bản"
                          >
                            <i data-lucide="history" class="w-3 h-3"></i>
                            <span>${escapeHtml(file.version)}</span>
                            <span class="opacity-70">(${historyCount})</span>
                          </button>
                        </td>

                        <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                          <div class="inline-flex items-center gap-1.5">
                            <a 
                              href="${escapeHtml(file.url)}" 
                              target="_blank" 
                              rel="noopener noreferrer"
                              class="px-2.5 py-1 btn-secondary font-mono text-[11px] font-medium inline-flex items-center gap-1"
                            >
                              <span>Mở Link</span>
                              <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
                            </a>
                            <button 
                              onclick="copyFileLink('${escapeHtml(file.url)}')"
                              class="px-2 py-1 btn-secondary font-mono text-[11px] inline-flex items-center gap-1 cursor-pointer"
                              title="Sao chép đường dẫn"
                            >
                              <i data-lucide="copy" class="w-3 h-3"></i>
                              <span>Copy</span>
                            </button>
                          </div>
                        </td>

                        <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                          <div class="flex items-center gap-2">
                            <img 
                              src="${escapeHtml(updaterAvatar)}" 
                              onerror="this.onerror=null; this.src='${escapeHtml(updaterFallback)}';"
                              alt="${escapeHtml(file.updatedBy)}"
                              class="w-7 h-7 rounded-full object-cover border theme-border shrink-0 ${portraitClass}"
                            />
                            <div>
                              <div class="font-semibold">${escapeHtml(file.updatedBy)}</div>
                              <div class="font-mono text-[11px] theme-text-muted">${escapeHtml(file.updatedAt)}</div>
                            </div>
                          </div>
                        </td>

                        <td class="table-cell-pad border-r theme-border max-w-xs theme-text-secondary leading-relaxed">
                          ${escapeHtml(file.notes || '—')}
                        </td>

                        ${customCols.map(cf => {
                          const val = file.customValues?.[cf.id] || '—';
                          const isApproved = val === 'Đã duyệt Master';
                          return `
                            <td class="table-cell-pad border-r theme-border whitespace-nowrap">
                              ${isApproved 
                                ? `<span class="px-2 py-0.5 font-mono text-[11px] font-semibold" style="background-color: var(--accent-bg); color: var(--accent-fg); border-radius: 4px;">${escapeHtml(val)}</span>`
                                : `<span class="theme-text-secondary">${escapeHtml(val)}</span>`
                              }
                            </td>
                          `;
                        }).join('')}

                        <td class="table-cell-pad text-right whitespace-nowrap">
                          <div class="inline-flex items-center gap-1.5">
                            ${canEditFile ? `
                              <button 
                                onclick="openFileModal('${escapeHtml(file.id)}')"
                                class="px-3 py-1.5 font-mono text-[11px] font-bold btn-secondary cursor-pointer"
                              >
                                Sửa File
                              </button>
                            ` : `
                              <span 
                                class="px-2.5 py-1.5 font-mono text-[11px] theme-surface theme-text-muted border theme-border cursor-not-allowed inline-flex items-center gap-1"
                                style="border-radius: var(--radius-btn);"
                                title="File này đã bị Admin khóa chỉnh sửa"
                              >
                                <i data-lucide="lock" class="w-3 h-3"></i>
                                <span>Đã khóa</span>
                              </span>
                            `}

                            ${isAdmin() ? `
                              <button 
                                onclick="toggleLockFile('${escapeHtml(file.id)}')"
                                class="px-2.5 py-1.5 font-mono text-[11px] font-semibold btn-secondary cursor-pointer inline-flex items-center gap-1"
                                title="${file.locked ? 'Mở khóa cho nhân viên sửa' : 'Khóa file chống chỉnh sửa'}"
                              >
                                <i data-lucide="${file.locked ? 'unlock' : 'lock'}" class="w-3 h-3"></i>
                                <span>${file.locked ? 'Mở khóa' : 'Khóa'}</span>
                              </button>
                              <button 
                                onclick="confirmDeleteFile('${escapeHtml(file.id)}')"
                                class="px-2.5 py-1.5 font-mono text-[11px] font-semibold btn-secondary cursor-pointer"
                              >
                                Xóa
                              </button>
                            ` : ''}
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * =====================================================================
     * TAB 04: CẤU TRÚC & GIAO DIỆN (CHỈ HIỂN THỊ VỚI ADMIN)
     * (A) TÙY CHỈNH THƯƠNG HIỆU & GIAO DIỆN WEB
     * (B) CẤU TRÚC THÔNG TIN HỆ THỐNG (DYNAMIC SCHEMA & DANH MỤC)
     * =====================================================================
     */
    function renderStructureTab() {
      if (!isAdmin()) {
        return `
          <div class="theme-card p-12 text-center">
            <div class="inline-block font-mono text-xs px-3 py-1 mb-3" style="background-color: var(--accent-bg); color: var(--accent-fg); border-radius: 4px;">
              ACCESS DENIED // 403
            </div>
            <h3 class="text-lg font-extrabold uppercase">Khu vực dành riêng cho Quản trị viên (Admin)</h3>
            <p class="text-xs theme-text-secondary mt-1">Tài khoản Nhân viên không được phép thay đổi giao diện, thương hiệu hoặc cấu trúc dữ liệu.</p>
          </div>
        `;
      }

      const b = state.branding;
      const modules = [
        { key: 'staff', title: '01. Bảng Nhân Sự', desc: 'Cột thông tin mở rộng cho hồ sơ nhân sự' },
        { key: 'schedule', title: '02. Bảng Lịch Làm Việc', desc: 'Cột thông tin mở rộng cho ca phân công' },
        { key: 'files', title: '03. Bảng File Sản Xuất', desc: 'Cột thông tin nhân viên điền khi thêm/sửa file' }
      ];

      const themes = [
        { id: 'pure-white', name: 'Trắng Tinh Khôi', sub: 'Pure White Editorial', bg: '#FFFFFF', fg: '#09090B', border: '#E4E4E7' },
        { id: 'warm-alabaster', name: 'Giấy Trắng Dịu Mắt', sub: 'Warm Alabaster Paper', bg: '#FAF9F6', fg: '#1C1917', border: '#E5DFD3' },
        { id: 'obsidian-dark', name: 'Đen Tuyền Hiện Đại', sub: 'Obsidian Studio Dark', bg: '#09090B', fg: '#FAFAFA', border: '#27272A' }
      ];

      return `
        <div class="space-y-8">
          <!-- ===============================================================
               PHẦN (A): TÙY CHỈNH THƯƠNG HIỆU & GIAO DIỆN WEB (ADMIN ONLY)
          ================================================================ -->
          <section class="theme-card p-5 sm:p-6 space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 pb-4 border-b theme-border">
              <div>
                <div class="inline-flex items-center gap-2 mb-1">
                  <span class="px-2 py-0.5 font-mono text-[10px] font-bold" style="background-color: var(--accent-bg); color: var(--accent-fg); border-radius: 4px;">ADMIN EXCLUSIVE</span>
                  <span class="font-mono text-xs theme-text-muted">BRANDING &amp; APPEARANCE ENGINE</span>
                </div>
                <h2 class="text-lg font-extrabold tracking-tight uppercase">A. Tùy Chỉnh Thương Hiệu, Logo &amp; Giao Diện Web</h2>
                <p class="text-xs theme-text-secondary mt-0.5">
                  Chỉ tài khoản Admin mới nhìn thấy và chỉnh sửa được khu vực này. Mọi thay đổi áp dụng ngay lập tức cho toàn bộ trang web.
                </p>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <!-- Cột trái: Tên thương hiệu, Tagline & Logo -->
              <div class="lg:col-span-6 space-y-4">
                <form onsubmit="handleSaveBrandingText(event)" class="space-y-3.5">
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="sm:col-span-2">
                      <label class="block text-xs font-semibold mb-1">Tên Thương Hiệu Trang Web *</label>
                      <input 
                        type="text" 
                        name="brandName" 
                        required 
                        value="${escapeHtml(b.brandName)}" 
                        placeholder="VD: NOIR // PRODUCTION"
                        class="w-full px-3 py-2 text-xs font-bold input-field"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold mb-1">Nhãn phiên bản</label>
                      <input 
                        type="text" 
                        name="versionTag" 
                        value="${escapeHtml(b.versionTag)}" 
                        placeholder="v3.0"
                        class="w-full px-3 py-2 text-xs font-mono input-field"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold mb-1">Khẩu hiệu / Dòng mô tả phụ (Tagline)</label>
                    <input 
                      type="text" 
                      name="tagline" 
                      value="${escapeHtml(b.tagline)}" 
                      placeholder="Hệ thống Quản lý Nhân sự, Lịch làm việc & Dữ liệu Sản xuất"
                      class="w-full px-3 py-2 text-xs input-field"
                    />
                  </div>

                  <div class="flex justify-end">
                    <button type="submit" class="px-4 py-2 text-xs font-semibold btn-primary cursor-pointer inline-flex items-center gap-1.5">
                      <i data-lucide="check" class="w-3.5 h-3.5"></i>
                      <span>Lưu Tên Thương Hiệu</span>
                    </button>
                  </div>
                </form>

                <!-- Tùy chỉnh Logo: Chọn 6 Icon hình học hoặc Upload Logo từ máy -->
                <div class="pt-4 border-t theme-border space-y-3">
                  <div class="flex items-center justify-between">
                    <label class="block text-xs font-bold uppercase font-mono">Logo Thương Hiệu</label>
                    <label class="px-3 py-1.5 text-xs font-mono font-semibold btn-secondary cursor-pointer inline-flex items-center gap-1.5">
                      <i data-lucide="upload" class="w-3.5 h-3.5"></i>

                      <input type="file" accept="image/*" onchange="handleUploadBrandLogo(event)" class="hidden" />

                        <button
                          type="button"
                          onclick="setBrandLogoIcon('${item.id}')"

                          style="${
                            selected
                              ? 'background-color: var(--accent-bg); color: var(--accent-fg); border-color: var(--accent-bg); border-radius: var(--radius-btn);'
                              : 'background-color: var(--bg-surface); color: var(--text-primary); border-color: var(--border-subtle); border-radius: var(--radius-btn);'
                          }"
                          title="${escapeHtml(item.name)}"
                        >
                          <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                          <span class="font-mono text-[10px] truncate w-full text-center">${escapeHtml(item.id)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>

              <!-- Cột phải: Bảng màu Monochrome, Bo góc, Mật độ & Lọc ảnh đen trắng -->
              <div class="lg:col-span-6 space-y-4 lg:border-l lg:pl-6 theme-border">
                <div>
                  <label class="block text-xs font-bold uppercase font-mono mb-2">1. Bảng Màu Hiển Thị (Monochrome Theme)</label>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    ${themes.map(th => {
                      const active = b.theme === th.id;
                      return `
                        <button
                          type="button"
                          onclick="updateBrandingSetting('theme', '${th.id}', 'Đã đổi bảng màu sang: ${th.name}')"
                          class="p-3 border text-left transition-all cursor-pointer flex flex-col justify-between gap-2"
                          style="background-color: ${th.bg}; color: ${th.fg}; border-color: ${active ? th.fg : th.border}; border-width: ${active ? '2px' : '1px'}; border-radius: var(--radius-btn);"
                        >
                          <div class="flex items-center justify-between">
                            <span class="w-4 h-4 rounded-full border" style="background-color: ${th.fg}; border-color: ${th.border};"></span>
                            ${active ? `<span class="font-mono text-[10px] font-bold px-1.5 py-0.5" style="background-color: ${th.fg}; color: ${th.bg}; border-radius: 3px;">ĐANG DÙNG</span>` : ''}
                          </div>
                          <div>
                            <div class="font-bold text-xs">${th.name}</div>
                            <div class="font-mono text-[10px] opacity-70">${th.sub}</div>
                          </div>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                  <div>
                    <label class="block text-xs font-bold uppercase font-mono mb-1.5">2. Phong Cách Bo Góc</label>
                    <div class="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onclick="updateBrandingSetting('corners', 'rounded', 'Đã bật bo góc mềm mại (Rounded)')"
                        class="px-3 py-2 text-xs font-semibold border cursor-pointer"
                        style="${b.corners === 'rounded' ? 'background-color: var(--accent-bg); color: var(--accent-fg); border-color: var(--accent-bg); border-radius: 9px;' : 'background-color: var(--bg-surface); border-color: var(--border-subtle); border-radius: 9px;'}"
                      >
                        Mềm mại (Rounded)
                      </button>
                      <button
                        type="button"

    /**
     * CÁC HÀM CẬP NHẬT THƯƠNG HIỆU & GIAO DIỆN (ADMIN ONLY)
     */
    function handleSaveBrandingText(e) {
      e.preventDefault();
      if (!isAdmin()) return;
      const form = e.target;
      state.branding.brandName = form.brandName.value.trim() || 'OPS // STUDIO';
      state.branding.versionTag = form.versionTag.value.trim() || 'v3.0';
      state.branding.tagline = form.tagline.value.trim();
      saveState();
      renderApp();
      showToast('ĐÃ CẬP NHẬT THƯƠNG HIỆU', `Tên trang web đã đổi thành "${state.branding.brandName}".`);
    }

    function setBrandLogoIcon(iconName) {
      if (!isAdmin()) return;
      state.branding.logoType = 'icon';
      state.branding.logoIcon = iconName;
      saveState();
      renderApp();
      showToast('ĐÃ ĐỔI LOGO BIỂU TƯỢNG', `Đã áp dụng biểu tượng logo: ${iconName}.`);
    }

    async function handleUploadBrandLogo(e) {
      if (!isAdmin()) return;
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const compressed = await compressImageFile(file, 200);
        state.branding.logoType = 'upload';
        state.branding.logoImageUrl = compressed;
        saveState();
        renderApp();
        showToast('ĐÃ TẢI LOGO MỚI', 'Logo thương hiệu tùy chỉnh đã được cập nhật lên thanh tiêu đề.');
      } catch (err) {
        showToast('LỖI TẢI ẢNH', 'Không thể đọc tệp hình ảnh này. Vui lòng thử ảnh PNG hoặc JPG.');
      }
    }

    function updateBrandingSetting(key, value, toastMsg) {
      if (!isAdmin()) return;
      state.branding[key] = value;
      saveState();
      renderApp();
      if (toastMsg) showToast('CẬP NHẬT GIAO DIỆN', toastMsg);
    }

    /**
     * =====================================================================
     * CÁC MODAL CRUD: NHÂN SỰ (CÓ UPLOAD ẢNH), LỊCH LÀM VIỆC, FILE, SCHEMA
     * =====================================================================
     */
    function renderCustomFieldsInputs(moduleKey, existingValues = {}) {
      const fields = state.customFields[moduleKey] || [];
      if (fields.length === 0) return '';

      return `
        <div class="pt-3 border-t border-dashed theme-border space-y-3">
          <span class="font-mono text-[11px] font-bold uppercase block">
            Trường thông tin mở rộng (Admin cấu hình)
          </span>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${fields.map(cf => {
              const val = existingValues[cf.id] || '';
              if (cf.type === 'select') {
                return `
                  <div>
                    <label class="block text-xs font-semibold mb-1">
                      ${escapeHtml(cf.label)} ${cf.required ? '*' : ''}
                    </label>
                    <select 
                      name="custom_${escapeHtml(cf.id)}" 
                      ${cf.required ? 'required' : ''}
                      class="w-full px-3 py-2 text-xs input-field"
                    >
                      <option value="">-- Chọn giá trị --</option>
                      ${(cf.options || []).map(opt => `
                        <option value="${escapeHtml(opt)}" ${val === opt ? 'selected' : ''}>${escapeHtml(opt)}</option>
                      `).join('')}
                    </select>
                  </div>
                `;
              }
              return `
                <div>
                  <label class="block text-xs font-semibold mb-1">
                    ${escapeHtml(cf.label)} ${cf.required ? '*' : ''}
                  </label>
                  <input 
                    type="${cf.type === 'date' ? 'date' : 'text'}" 
                    name="custom_${escapeHtml(cf.id)}" 
                    value="${escapeHtml(val)}"
                    ${cf.required ? 'required' : ''}
                    placeholder="Nhập ${escapeHtml(cf.label.toLowerCase())}..."
                    class="w-full px-3 py-2 text-xs input-field"
                  />
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function extractCustomValuesFromForm(formElement, moduleKey) {
      const fields = state.customFields[moduleKey] || [];
      const result = {};
      fields.forEach(cf => {
        const input = formElement.elements[`custom_${cf.id}`];
        if (input) result[cf.id] = input.value.trim();
      });
      return result;
    }
