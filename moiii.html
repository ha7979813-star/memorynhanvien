    function bumpVersion(type) {
      const input = document.getElementById('file-version-input');
      if (!input) return;
      const raw = input.value.trim().replace(/^v/i, '');
      const parts = raw.split('.');
      let major = parseInt(parts[0], 10);
      let minor = parseInt(parts[1] || '0', 10);
      if (isNaN(major)) major = 1;
      if (isNaN(minor)) minor = 0;

      if (type === 'major') {
        major += 1;
        minor = 0;
      } else {
        minor += 1;
      }
      input.value = `v${major}.${minor}`;
    }

    function handleSaveFile(e, existingId) {
      e.preventDefault();
      const form = e.target;
      const customValues = extractCustomValuesFromForm(form, 'files');
      const actorName = getCurrentActorName();
      const nowStr = getCurrentTimestamp();

      const version = form.version.value.trim();
      const url = form.url.value.trim();
      const notes = form.notes.value.trim();

      if (existingId) {
        const idx = state.files.findIndex(f => f.id === existingId);
        if (idx !== -1) {
          const oldFile = state.files[idx];
          if (oldFile.locked && !isAdmin()) {
            showToast('TỪ CHỐI GHI ĐÈ', 'File đã bị Admin khóa chỉnh sửa.');
            return;
          }
          const updatedHistory = [
            ...(oldFile.history || []),
            {
              version,
              updatedBy: actorName,
              updatedAt: nowStr,
              note: notes,
              url
            }
          ];

          state.files[idx] = {
            ...oldFile,
            name: form.name.value.trim(),
            project: form.project.value,
            category: form.category.value,
            version,
            url,
            updatedBy: actorName,
            updatedAt: nowStr,
            notes,
            customValues,
            history: updatedHistory
          };
          showToast('ĐÃ CẬP NHẬT FILE', `${actorName} đã lưu phiên bản ${version} cho ${existingId}.`);
        }
      } else {
        const newId = `FILE-${String(state.files.length + 1).padStart(3, '0')}`;
        const newFile = {
          id: newId,
          name: form.name.value.trim(),
          project: form.project.value,
          category: form.category.value,
          version,
          url,
          updatedBy: actorName,
          updatedAt: nowStr,
          locked: false,
          notes,
          customValues,
          history: [
            {
              version,
              updatedBy: actorName,
              updatedAt: nowStr,
              note: notes,
              url
            }
          ]
        };
        state.files.unshift(newFile);
        showToast('ĐÃ THÊM FILE MỚI', `${actorName} đã thêm ${newId} (${version}) vào kho sản xuất.`);
      }

      saveState();
      closeModal();
      renderApp();
    }

    function toggleLockFile(fileId) {
      if (!isAdmin()) {
        showToast('TỪ CHỐI QUYỀN', 'Chỉ Admin mới có quyền khóa hoặc mở khóa file.');
        return;
      }
      const idx = state.files.findIndex(f => f.id === fileId);
      if (idx !== -1) {
        state.files[idx].locked = !state.files[idx].locked;
        saveState();
        renderApp();
        showToast(
          state.files[idx].locked ? 'ĐÃ KHÓA FILE' : 'ĐÃ MỞ KHÓA FILE',
          state.files[idx].locked
            ? `File ${fileId} đã khóa. Nhân viên chỉ được xem, không thể sửa.`
            : `File ${fileId} đã mở khóa cho phép nhân viên cập nhật phiên bản.`
        );
      }
    }

    function confirmDeleteFile(fileId) {
      if (!isAdmin()) {
        showToast('TỪ CHỐI QUYỀN XÓA', 'Nhân viên không có quyền xóa file dữ liệu sản xuất.');
        return;
      }

      const file = state.files.find(f => f.id === fileId);
      if (!file) return;

      openModal(`
        <div class="p-6">
          <h3 class="font-extrabold text-base uppercase border-b theme-border pb-3 mb-3">Xóa file dữ liệu sản xuất</h3>
          <p class="text-xs theme-text-secondary leading-relaxed mb-5">
            Bạn có chắc chắn muốn xóa vĩnh viễn file <strong style="color: var(--text-primary);">${escapeHtml(file.name)} (${escapeHtml(file.id)})</strong> cùng toàn bộ lịch sử phiên bản?
          </p>
          <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold btn-secondary cursor-pointer">Hủy</button>
            <button onclick="deleteFile('${escapeHtml(fileId)}')" class="px-4 py-2 text-xs font-semibold btn-primary cursor-pointer">Xóa file</button>
          </div>
        </div>
      `, 'max-w-md');
    }

    function deleteFile(fileId) {
      if (!isAdmin()) return;
      state.files = state.files.filter(f => f.id !== fileId);
      saveState();
      closeModal();
      renderApp();
      showToast('ĐÃ XÓA FILE', `Quản trị viên đã xóa ${fileId} khỏi kho dữ liệu.`);
    }

    function openFileHistoryModal(fileId) {
      const file = state.files.find(f => f.id === fileId);
      if (!file) return;

      const historyList = [...(file.history || [])].reverse();
      const portraitClass = state.branding.monoAvatars ? 'portrait-mono' : 'portrait-color';
      const canEditFile = isAdmin() || !file.locked;

      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-start justify-between border-b theme-border pb-3 gap-3">
            <div>
              <span class="font-mono text-[10px] px-1.5 py-0.5 border theme-border-strong" style="border-radius: 4px;">VERSION AUDIT TRAIL</span>
              <h3 class="font-extrabold text-sm sm:text-base font-mono mt-1.5 break-all">${escapeHtml(file.name)}</h3>
              <p class="text-xs theme-text-muted mt-0.5">${escapeHtml(file.project)}</p>
            </div>
            <button onclick="closeModal()" class="font-mono text-xs px-2.5 py-1 btn-secondary cursor-pointer">✕</button>
          </div>

          <div class="space-y-3 max-h-96 overflow-y-auto pr-1">
            ${historyList.map((h, i) => {
              const actorStaff = getStaffByName(h.updatedBy);
              const actorAvatar = actorStaff ? (actorStaff.avatar || getFallbackAvatarUrl(h.updatedBy)) : getFallbackAvatarUrl(h.updatedBy);
              return `
                <div class="p-3.5 border ${i === 0 ? 'theme-border-strong theme-surface' : 'theme-border'}" style="border-radius: var(--radius-btn);">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2">
                      <span class="font-mono text-xs font-bold px-2 py-0.5" style="${i === 0 ? 'background-color: var(--accent-bg); color: var(--accent-fg);' : 'background-color: var(--bg-surface); border: 1px solid var(--border-subtle);'} border-radius: 4px;">
                        ${escapeHtml(h.version)}
                      </span>
                      <img src="${escapeHtml(actorAvatar)}" onerror="this.onerror=null; this.src='${escapeHtml(getFallbackAvatarUrl(h.updatedBy))}';" alt="" class="w-5 h-5 rounded-full object-cover ${portraitClass}" />
                      <span class="text-xs font-bold">${escapeHtml(h.updatedBy)}</span>
                      ${i === 0 ? `<span class="font-mono text-[10px] underline">HIỆN TẠI</span>` : ''}
                    </div>
                    <span class="font-mono text-[11px] theme-text-muted">${escapeHtml(h.updatedAt)}</span>
                  </div>
                  <p class="text-xs theme-text-secondary leading-relaxed mb-2">${escapeHtml(h.note)}</p>
                  <a href="${escapeHtml(h.url)}" target="_blank" rel="noopener noreferrer" class="font-mono text-[11px] underline hover:opacity-80 break-all">
                    ${escapeHtml(h.url)} ↗
                  </a>
                </div>
              `;
            }).join('')}
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t theme-border">
            ${canEditFile ? `
              <button onclick="closeModal(); openFileModal('${escapeHtml(file.id)}');" class="px-4 py-2 text-xs font-semibold btn-primary cursor-pointer">
                + Cập nhật phiên bản mới
              </button>
            ` : ''}
            <button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold btn-secondary cursor-pointer">Đóng</button>
          </div>
        </div>
      `);
    }

    function copyFileLink(url) {
      const tempInput = document.createElement('input');
      tempInput.value = url;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast('ĐÃ SAO CHÉP LINK', 'Đường dẫn lưu trữ file đã được sao chép vào bộ nhớ tạm.');
      } catch (err) {
        showToast('KHÔNG THỂ SAO CHÉP', 'Vui lòng mở trực tiếp đường dẫn từ bảng.');
      }
      document.body.removeChild(tempInput);
    }

    // --- MODAL THÊM TRƯỜNG DỮ LIỆU ĐỘNG (DYNAMIC SCHEMA — ADMIN ONLY) ---
    function openQuickCustomFieldModal(defaultModule = 'files') {
      if (!isAdmin()) {
        showToast('TỪ CHỐI QUYỀN', 'Chỉ Admin mới có quyền thay đổi cấu trúc trường dữ liệu.');
        return;
      }

      openModal(`
        <form onsubmit="handleSaveCustomField(event)" class="p-6 space-y-4">
          <div class="flex items-center justify-between border-b theme-border pb-3">
            <div>
              <span class="font-mono text-[10px] px-1.5 py-0.5" style="background-color: var(--accent-bg); color: var(--accent-fg); border-radius: 4px;">SCHEMA BUILDER</span>
              <h3 class="font-extrabold text-base uppercase mt-1">Thêm Trường Dữ Liệu Tùy Biến Mới</h3>
            </div>
            <button type="button" onclick="closeModal()" class="font-mono text-xs px-2.5 py-1 btn-secondary cursor-pointer">✕</button>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold mb-1">Áp dụng cho phân hệ *</label>
              <select name="moduleKey" class="w-full px-3 py-2 text-xs font-semibold input-field">
                <option value="staff" ${defaultModule === 'staff' ? 'selected' : ''}>01. Bảng Nhân Sự</option>
                <option value="schedule" ${defaultModule === 'schedule' ? 'selected' : ''}>02. Bảng Lịch Làm Việc</option>
                <option value="files" ${defaultModule === 'files' ? 'selected' : ''}>03. Bảng File Dữ Liệu Sản Xuất</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1">Tên cột / Trường thông tin mới *</label>
              <input type="text" name="label" required placeholder="VD: Deadline bàn giao, Mã ổ cứng, Định mức..." class="w-full px-3 py-2 text-xs input-field" />
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1">Kiểu dữ liệu nhập *</label>
              <select name="type" onchange="toggleSelectOptionsInput(this.value)" class="w-full px-3 py-2 text-xs input-field">
                <option value="text">Văn bản ngắn / Số liệu</option>
                <option value="date">Ngày tháng (Date Picker)</option>
                <option value="select">Danh sách lựa chọn (Dropdown Select)</option>
              </select>
            </div>

            <div id="custom-field-options-box" class="hidden">
              <label class="block text-xs font-semibold mb-1">Các giá trị lựa chọn (Phân cách bằng dấu phẩy) *</label>
              <input type="text" name="options" placeholder="VD: Ưu tiên cao, Bình thường, Thấp" class="w-full px-3 py-2 text-xs input-field" />
            </div>

            <label class="inline-flex items-center gap-2 text-xs cursor-pointer pt-1">
              <input type="checkbox" name="required" class="w-4 h-4 accent-zinc-900" />
              <span>Bắt buộc nhập trường thông tin này trên biểu mẫu</span>
            </label>
          </div>

          <div class="flex items-center justify-end gap-2 pt-3 border-t theme-border">
            <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold btn-secondary cursor-pointer">Hủy</button>
            <button type="submit" class="px-5 py-2 text-xs font-semibold btn-primary cursor-pointer">
              + Thêm vào cấu trúc bảng
            </button>
          </div>
        </form>
      `, 'max-w-md');
    }

    function toggleSelectOptionsInput(typeVal) {
      const box = document.getElementById('custom-field-options-box');
      if (!box) return;
      if (typeVal === 'select') box.classList.remove('hidden');
      else box.classList.add('hidden');
    }

    function handleSaveCustomField(e) {
      e.preventDefault();
      if (!isAdmin()) return;

      const form = e.target;
      const moduleKey = form.moduleKey.value;
      const label = form.label.value.trim();
      const type = form.type.value;
      const required = form.required.checked;
      const rawOptions = form.options ? form.options.value : '';
      const options = type === 'select'
        ? rawOptions.split(',').map(s => s.trim()).filter(Boolean)
        : [];

      if (type === 'select' && options.length === 0) {
        showToast('THIẾU GIÁ TRỊ CHỌN', 'Vui lòng nhập ít nhất 1 lựa chọn phân cách bằng dấu phẩy.');
        return;
      }

      state.customFields[moduleKey].push({
        id: `cf_${moduleKey}_${Date.now()}`,
        label,
        type,
        options,
        required
      });
      saveState();
      closeModal();
      renderApp();
      showToast('ĐÃ CẬP NHẬT CẤU TRÚC', `Đã thêm cột "${label}" vào bảng dữ liệu tương ứng.`);
    }

    function confirmDeleteCustomField(moduleKey, fieldId) {
      if (!isAdmin()) return;
      const field = state.customFields[moduleKey]?.find(f => f.id === fieldId);
      if (!field) return;

      openModal(`
        <div class="p-6">
          <h3 class="font-extrabold text-base uppercase border-b theme-border pb-3 mb-3">Xóa trường dữ liệu khỏi cấu trúc</h3>
          <p class="text-xs theme-text-secondary leading-relaxed mb-5">
            Bạn có chắc chắn muốn xóa cột <strong style="color: var(--text-primary);">"${escapeHtml(field.label)}"</strong>? Cột này sẽ biến mất khỏi bảng dữ liệu và biểu mẫu nhập liệu.
          </p>
          <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold btn-secondary cursor-pointer">Hủy</button>
            <button onclick="deleteCustomField('${escapeHtml(moduleKey)}', '${escapeHtml(fieldId)}')" class="px-4 py-2 text-xs font-semibold btn-primary cursor-pointer">Xóa cột</button>
          </div>
        </div>
      `, 'max-w-md');
    }

    function deleteCustomField(moduleKey, fieldId) {
      if (!isAdmin()) return;
      state.customFields[moduleKey] = state.customFields[moduleKey].filter(f => f.id !== fieldId);
      saveState();
      closeModal();
      renderApp();
      showToast('ĐÃ XÓA TRƯỜNG DỮ LIỆU', 'Cấu trúc bảng đã được cập nhật.');
    }

    // --- QUẢN LÝ DANH MỤC FILE & DỰ ÁN (ADMIN ONLY) ---
    function handleAddCategory(e) {
      e.preventDefault();
      if (!isAdmin()) return;
      const input = document.getElementById('new-category-input');
      const val = input.value.trim();
      if (!val) return;
      if (state.fileCategories.includes(val)) {
        showToast('DANH MỤC ĐÃ TỒN TẠI', `Phân loại "${val}" đã có trong danh sách.`);
        return;
      }
      state.fileCategories.push(val);
      saveState();
      renderApp();
      showToast('THÊM PHÂN LOẠI FILE', `Đã bổ sung danh mục "${val}".`);
    }

    function deleteCategory(idx) {
      if (!isAdmin() || state.fileCategories.length <= 1) return;
      const removed = state.fileCategories.splice(idx, 1)[0];
      saveState();
      renderApp();
      showToast('ĐÃ XÓA PHÂN LOẠI', `Đã gỡ bỏ danh mục "${removed}".`);
    }

    function handleAddProject(e) {
      e.preventDefault();
      if (!isAdmin()) return;
      const input = document.getElementById('new-project-input');
      const val = input.value.trim();
      if (!val) return;
      if (state.projects.includes(val)) {
        showToast('DỰ ÁN ĐÃ TỒN TẠI', 'Mã/tên dự án này đã có trong hệ thống.');
        return;
      }
      state.projects.push(val);
      saveState();
      renderApp();
      showToast('THÊM DỰ ÁN MỚI', `Đã thêm dự án "${val}".`);
    }

    function deleteProject(idx) {
      if (!isAdmin() || state.projects.length <= 1) return;
      const removed = state.projects.splice(idx, 1)[0];
      saveState();
      renderApp();
      showToast('ĐÃ XÓA DỰ ÁN', `Đã xóa "${removed}" khỏi danh sách vận hành.`);
    }

    /**
     * RENDER TỔNG THỂ & KHỞI TẠO LUCIDE ICONS
     */
    function renderWorkspaceOnly() {
      const container = document.getElementById('workspace-container');
      // Kích hoạt lại animation chuyển tab mượt mà
      container.classList.remove('animate-tab');
      void container.offsetWidth;
      container.classList.add('animate-tab');

      if (state.activeTab === 'staff') {
        container.innerHTML = renderStaffTab();
      } else if (state.activeTab === 'schedule') {
        container.innerHTML = renderScheduleTab();
      } else if (state.activeTab === 'files') {
        container.innerHTML = renderFilesTab();
      } else if (state.activeTab === 'structure') {
        container.innerHTML = renderStructureTab();
      }

      if (window.lucide) lucide.createIcons();
    }

    function renderApp() {
      applyThemeAttributes();
      renderHeaderControls();
      renderKPIs();
      renderTabs();
      renderWorkspaceOnly();
      if (window.lucide) lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
